name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      # Coverage floor (v8 lines≥80) on protocol. No extra `--` after `test`:
      # vitest would treat `--coverage` as a file filter and the 80% gate would
      # never run. Add `--filter @openbot/daemon` only once that package exists.
      # Do not `pnpm -r test --coverage` — `packages/app` is Playwright later.
      - run: pnpm --filter @openbot/protocol test --coverage
      - run: pnpm --filter @openbot/daemon test --coverage
