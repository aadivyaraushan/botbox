name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm --filter @openbot/protocol --filter @openbot/daemon test --coverage
      - run: pnpm --filter @openbot/app test

  app-e2e:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      # pnpm may skip electron's postinstall binary download; force it for Playwright.
      - name: Ensure Electron binary
        run: |
          set -euo pipefail
          ELECTRON_DIR="$(pnpm --filter @openbot/app exec node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          node "$ELECTRON_DIR/install.js"
          pnpm --filter @openbot/app exec electron --version
      - run: pnpm --filter @openbot/app build
      - run: pnpm --filter @openbot/app exec playwright test --project=ci
